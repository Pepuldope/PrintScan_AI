<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintScan AI — Create account</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #ececec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #d97706, #ea580c);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .brand-logo svg { width: 28px; height: 28px; fill: #fff; }
    .brand h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .brand p  { font-size: 0.875rem; color: #888; line-height: 1.5; }

    .card {
      background: #242424;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 28px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 22px;
    }

    form { display: flex; flex-direction: column; gap: 16px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #1a1a1a;
      color: #ececec;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input::placeholder { color: #555; }
    input:focus { border-color: #d97706; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #d97706;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .btn:hover    { background: #b45309; }
    .btn:active   { transform: scale(0.98); }
    .btn:disabled { background: #444; cursor: not-allowed; }

    .msg {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
      display: none;
    }
    .msg.visible { display: block; }
    .msg.error   { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #f87171; }
    .msg.loading { background: rgba(255,255,255,0.04); border: 1px solid #333; color: #888; }

    .footer-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.83rem;
      color: #666;
    }

    .footer-link a {
      color: #d97706;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link a:hover { text-decoration: underline; }

    .password-hint {
      font-size: 0.75rem;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      </div>
      <h1>PrintScan AI</h1>
      <p>Diagnose your 3D print failures with AI</p>
    </div>

    <div class="card">
      <div class="card-title">Create your account</div>
      <form id="form">
        <div>
          <label for="name">Full name</label>
          <input id="name" type="text" placeholder="Your name" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="At least 6 characters" required>
          <div class="password-hint">Minimum 6 characters</div>
        </div>
        <div>
          <label for="confirm">Confirm password</label>
          <input id="confirm" type="password" placeholder="Repeat your password" required>
        </div>
        <button class="btn" id="btn" type="submit">Create account</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footer-link">
      Already have an account? <a href="/">Sign in</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem("token")) window.location.href = "/chat.html";

    const form = document.getElementById("form");
    const btn  = document.getElementById("btn");
    const msg  = document.getElementById("msg");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = `msg visible ${type}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirm  = document.getElementById("confirm").value;

      if (password !== confirm) {
        showMsg("Passwords do not match.", "error");
        return;
      }
      if (password.length < 6) {
        showMsg("Password must be at least 6 characters.", "error");
        return;
      }

      btn.disabled = true;
      showMsg("Creating account...", "loading");

      try {
        const res  = await fetch("/api/auth/register", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({
            name:     document.getElementById("name").value.trim(),
            email:    document.getElementById("email").value.trim(),
            password: password
          })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem("token",       data.token);
          localStorage.setItem("displayName", data.displayName);
          localStorage.setItem("email",       data.email);
          localStorage.setItem("role",        data.role);
          // New users go to profile setup first
          window.location.href = "/profile.html?new=1";
        } else {
          showMsg(data.message, "error");
          btn.disabled = false;
        }
      } catch {
        showMsg("Could not connect to the server.", "error");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
