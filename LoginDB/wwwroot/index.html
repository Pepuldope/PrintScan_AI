<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintScan AI — Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #ececec;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 24px 20px;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #d97706, #ea580c);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .brand-logo svg { width: 28px; height: 28px; fill: #fff; }
    .brand h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .brand p  { font-size: 0.875rem; color: #888; line-height: 1.5; }

    .card {
      background: #242424;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 28px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #e0e0e0;
      margin-bottom: 22px;
    }

    form { display: flex; flex-direction: column; gap: 16px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #999;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #1a1a1a;
      color: #ececec;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input::placeholder { color: #555; }
    input:focus { border-color: #d97706; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #d97706;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }

    .btn:hover    { background: #b45309; }
    .btn:active   { transform: scale(0.98); }
    .btn:disabled { background: #444; cursor: not-allowed; }

    .msg {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.5;
      display: none;
    }
    .msg.visible { display: block; }
    .msg.error   { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #f87171; }
    .msg.loading { background: rgba(255,255,255,0.04); border: 1px solid #333; color: #888; }

    .footer-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.83rem;
      color: #666;
    }

    .footer-link a {
      color: #d97706;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link a:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 0;
      color: #555;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #333;
    }

    .try-anon-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.82rem;
      color: #888;
      text-decoration: none;
      transition: color 0.15s;
    }
    .try-anon-link:hover { color: #d97706; }

    @media (max-width: 480px) {
      .container { padding: 20px 14px; }
      .card { padding: 22px 18px; }
      .brand { margin-bottom: 24px; }
      input { font-size: 16px; } /* prevent iOS auto-zoom */
      .g_id_signin > div { width: 100% !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      </div>
      <h1>PrintScan AI</h1>
      <p>Diagnose your 3D print failures with AI</p>
    </div>

    <div class="card">
      <div class="card-title">Sign in to your account</div>
      <form id="form">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="Your password" required>
        </div>
        <button class="btn" id="btn" type="submit">Sign in</button>
      </form>
      <div class="msg" id="msg"></div>

      <div class="divider">or</div>
      <div id="g_id_onload"
           data-client_id="589636484325-eek6frv1rhr8pe22k6oggbfben35c6a0.apps.googleusercontent.com"
           data-callback="handleGoogleSignIn"
           data-auto_prompt="false"></div>
      <div class="g_id_signin"
           data-type="standard"
           data-theme="filled_black"
           data-size="large"
           data-text="signin_with"
           data-shape="rectangular"
           data-logo_alignment="left"
           data-width="304"
           style="margin-top: 12px; display: flex; justify-content: center;"></div>
      <a class="try-anon-link" href="/chat.html">Try without signing in →</a>
    </div>

    <div class="footer-link">
      Don't have an account? <a href="/register.html">Create one</a>
    </div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem("token")) {
      window.location.href = "/chat.html";
    }

    const form = document.getElementById("form");
    const btn  = document.getElementById("btn");
    const msg  = document.getElementById("msg");

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = `msg visible ${type}`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      showMsg("Signing in...", "loading");

      try {
        const res  = await fetch("/api/auth/login", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({
            email:    document.getElementById("email").value,
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem("token",       data.token);
          localStorage.setItem("displayName", data.displayName);
          localStorage.setItem("email",       data.email);
          localStorage.setItem("role",        data.role);
          window.location.href = "/chat.html";
        } else {
          showMsg(data.message, "error");
          btn.disabled = false;
        }
      } catch {
        showMsg("Could not connect to the server.", "error");
        btn.disabled = false;
      }
    });

    window.handleGoogleSignIn = async function(response) {
      showMsg("Signing in with Google...", "loading");
      try {
        const res  = await fetch("/api/auth/google", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ idToken: response.credential })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem("token",       data.token);
          localStorage.setItem("displayName", data.displayName);
          localStorage.setItem("email",       data.email);
          localStorage.setItem("role",        data.role);
          window.location.href = "/chat.html";
        } else {
          showMsg(data.message || "Google sign-in failed.", "error");
        }
      } catch {
        showMsg("Could not connect to the server.", "error");
      }
    };

  </script>
</body>
</html>
